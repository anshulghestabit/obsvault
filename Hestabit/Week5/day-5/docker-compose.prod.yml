services:
  client:
    build: ./client
    restart: ${RESTART_POLICY}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  server:
    build: ./server
    restart: ${RESTART_POLICY}
    environment:
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: ${RESTART_POLICY}
    depends_on:
      - client
      - server
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3