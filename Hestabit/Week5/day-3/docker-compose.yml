services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2

  server1:
    build: ./server
    environment:
      INSTANCE_NAME: server1

  server2:
    build: ./server
    environment:
      INSTANCE_NAME: server2