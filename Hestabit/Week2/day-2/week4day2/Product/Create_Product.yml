info:
  name: Create_Product
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/products
  body:
    type: json
    data: |
      {
        "name": "Laptop",
        "price": 70000,
        "status": "active"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body._id != undefined
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
